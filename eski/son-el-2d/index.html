<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Son El</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-screen="title">

<!-- ODA -->
<div id="room">
  <div class="wall"></div>
  <div class="lamp"><div class="cord"></div><div class="shade"></div><div class="bulb"></div><div class="cone"></div></div>
  <div class="table"><div class="felt"><div class="felt-print">SON EL<small>KAYBEDEN TETİĞİ ÇEKER</small></div><i class="burn b1"></i><i class="burn b2"></i><i class="burn b3"></i><i class="stain s1"></i><i class="stain s2"></i></div></div>
  <div class="ashtray" id="ashtray"><div class="cig"></div></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>

<!-- BAŞLIK -->
<section id="title-screen" class="screen active">
  <div class="title-wrap">
    <div class="title-gun" id="title-gun"></div>
    <h1 class="logo">SON EL</h1>
    <p class="subtitle">Blackjack. Kaybeden tetiği çeker.</p>
    <div class="title-btns">
      <button class="chipbtn red" id="btn-new"><span>Masaya<br>Otur</span></button>
      <button class="chipbtn black" id="btn-how"><span>Kurallar</span></button>
    </div>
    <p class="record" id="record"></p>
  </div>
</section>

<!-- OYUN -->
<section id="game-screen" class="screen">
  <header class="hud-top">
    <div class="tableno"><span class="lbl">Masa</span><b id="h-table">1</b><small>/7</small></div>
    <div class="hud-btns">
      <button class="tbtn" id="btn-help">Kurallar</button>
      <button class="tbtn" id="btn-speed">Hız ×1</button>
      <button class="tbtn" id="btn-sound">Ses: Açık</button>
      <button class="tbtn" id="btn-quit">Kalk</button>
    </div>
  </header>

  <section class="seat opp-seat">
    <div class="mugshot" id="o-mug"><div class="mug-lines"></div><span id="o-icon"></span><div class="mug-plate" id="o-plate"></div></div>
    <div class="opp-info">
      <div class="opp-name" id="o-name"></div>
      <div class="opp-quirk" id="o-quirk"></div>
      <div class="cyl-row"><span class="lbl">Silindiri</span><div class="mini-cyl" id="o-cyl"></div><span class="odds" id="o-odds"></span></div>
    </div>
    <div class="bubble" id="o-bubble"></div>
  </section>

  <section class="hands">
    <div class="hand-row" id="a-row">
      <div class="cards" id="a-cards"></div>
      <div class="total" id="a-total"></div>
    </div>
    <div class="center-line">
      <div class="gun-on-table" id="gun-table"></div>
      <div class="msg" id="msg"></div>
      <div class="shoe" id="shoe"><div class="shoe-box"><div class="shoe-card"></div></div><span id="shoe-n"></span></div>
    </div>
    <div class="hand-row" id="p-row">
      <div class="cards" id="p-cards"></div>
      <div class="total" id="p-total"></div>
    </div>
  </section>

  <footer class="seat me-seat">
    <div class="my-cyl">
      <span class="lbl">Senin silindirin</span>
      <div class="mini-cyl big" id="p-cyl"></div>
      <span class="odds" id="p-odds"></span>
      <div class="passes" id="p-pass"></div>
    </div>
    <div class="actions">
      <button class="chipbtn green" id="btn-hit"><span>Kart<br>Çek</span><kbd>H</kbd></button>
      <button class="chipbtn red" id="btn-stand"><span>Dur</span><kbd>S</kbd></button>
      <button class="chipbtn gold" id="btn-double"><span>İkiye<br>Katla</span><kbd>D</kbd></button>
    </div>
    <div class="turn-info" id="turn-info"></div>
  </footer>
</section>

<!-- TETİK SAHNESİ -->
<section id="gun-scene">
  <div class="gs-who" id="gs-who"></div>
  <div class="gs-portrait" id="gs-portrait"></div>
  <div class="gs-cyl-wrap"><div class="gs-cyl" id="gs-cyl"></div><div class="gs-pin"></div></div>
  <div class="gs-odds" id="gs-odds"></div>
  <div class="gs-btns" id="gs-btns"></div>
  <div class="gs-result" id="gs-result"></div>
</section>

<div id="cracks"></div>
<div id="modal-root"></div>
<div id="tip"></div>

<script src="js/rules.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
</body>
</html>
